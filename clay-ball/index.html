<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Clay Ball</title>
<style>
/* A single ball of clay on a solid color you choose. The color is the background, so there is no light/dark switch. */
:root { --bg: #1b1410; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); overflow: hidden; }
svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
svg.grabbing { cursor: grabbing; }
:root { --ink: #efe6d8; --soft: #b5a894; --line: rgba(239, 230, 216, 0.28); --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.panel { max-height: calc(100vh - 32px); overflow-y: auto; position: fixed; top: 16px; right: 16px; z-index: 5; width: 232px; box-sizing: border-box; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(22, 16, 12, 0.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink); font: 13px/1.4 var(--font); }
.panel { transition: transform .7s ease, opacity .5s ease; }
.panel.away { transform: translateX(115%); opacity: 0; pointer-events: none; }
#ptoggle { position: fixed; top: 16px; right: 16px; z-index: 6; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(22, 16, 12, 0.78); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; backdrop-filter: blur(10px); }
#ptoggle[hidden] { display: none; }
#bye { position: fixed; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .4s ease; }
#bye.show { opacity: 1; }
#bye .byeBox { text-align: center; padding: 26px 34px; border-radius: 18px; background: rgba(22, 16, 12, 0.82); border: 1px solid var(--line); backdrop-filter: blur(12px); transform: scale(.6); }
#bye.show .byeBox { animation: pop .55s cubic-bezier(.2, 1.5, .4, 1) forwards; }
@keyframes pop { to { transform: scale(1); } }
#bye .byeT { color: var(--ink); font-size: 30px; font-weight: 600; margin-bottom: 16px; letter-spacing: .01em; }
#bye button { pointer-events: auto; padding: 11px 26px; border-radius: 12px; border: 0; background: #efe6d8; color: #1a120c; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
.panel h2 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--soft); }
.panel label { display: block; margin-bottom: 6px; color: var(--soft); font-size: 12px; }
.pick { display: flex; align-items: center; gap: 10px; }
.pick input[type="color"] { width: 44px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
.pick output { font: 500 13px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); }
.sw { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 14px; }
.sw button { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
.sw button[aria-pressed="true"] { border-color: var(--ink); }
.row { margin: 0 0 12px; }
.row .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.row .top label { margin: 0; }
.row output { font: 500 12px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); }
.panel input[type="range"] { width: 100%; margin: 0; accent-color: #efe6d8; cursor: pointer; }
.reset { width: 100%; min-height: 34px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--ink); font: 500 12px var(--font); cursor: pointer; }
.reset[aria-pressed="false"] { color: var(--soft); }
.reset:hover { background: rgba(255,255,255,0.08); }
.copy { width: 100%; min-height: 38px; border: 0; border-radius: 9px; background: var(--ink); color: #1a1410; font: 600 13px var(--font); cursor: pointer; }
.copy:hover { background: #fff; }
.panel button:focus-visible, .panel input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.panel textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 10px; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,0.35); color: var(--ink); font: 12px/1.4 var(--font); padding: 8px; }
.panel textarea[hidden] { display: none; }
@media (max-width: 520px) { .panel { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; max-height: 56vh; } }
</style>
